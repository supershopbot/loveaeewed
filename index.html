<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dla Tereski ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #ffe6f0, #ff8fbd);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.box {
    width: 90%;
    max-width: 500px;
    background: white;
    padding: 30px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: appear 0.7s ease;
}

h1 {
    color: #ed3d7b;
}

p {
    font-size: 18px;
    color: #555;
}

input {
    width: 150px;
    padding: 14px;
    border-radius: 15px;
    border: 2px solid #ff70a7;
    text-align: center;
    font-size: 25px;
    letter-spacing: 7px;
}

button {
    border: 0;
    border-radius: 15px;
    padding: 14px 25px;
    margin: 8px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    transform: scale(1.08);
}

.pink {
    background: #ff4f91;
    color: white;
}

.white {
    background: #ffd4e3;
    color: #a82f5d;
}

.hidden {
    display: none;
}

.question {
    font-size: 24px;
    font-weight: bold;
    color: #ed3d7b;
    margin: 25px 0;
}

.answers button {
    display: block;
    width: 100%;
    background: #ffe1ec;
    color: #9d3159;
}

.answers button.correct {
    background: #83e69b;
    color: #176126;
}

.answers button.wrong {
    background: #ff8795;
    color: #751c2b;
    animation: shake 0.5s;
}

.love {
    font-size: 38px;
    font-weight: bold;
    color: #ed3d7b;
    animation: pulse 1s infinite;
}

.heart {
    position: fixed;
    bottom: -50px;
    font-size: 30px;
    animation: fly 4s linear forwards;
    pointer-events: none;
}

.confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 10px;
    animation: fall 3s linear forwards;
    pointer-events: none;
}

#message {
    min-height: 30px;
    margin-top: 10px;
    color: #e83d67;
    font-weight: bold;
}

#score {
    color: #e83d67;
    font-weight: bold;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
}

@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-10px);
    }
    50% {
        transform: translateX(10px);
    }
    75% {
        transform: translateX(-10px);
    }
}

@keyframes fly {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fall {
    from {
        transform: translateY(0) rotate(0deg);
    }
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<!-- PIN -->
<div id="pinPage" class="box">

    <h1>🔐 Sekretna strona ❤️</h1>

    <p>Dla mojej myszki 🐭</p>

    <input
        id="pin"
        type="password"
        maxlength="4"
        placeholder="••••"
    >

    <br><br>

    <button class="pink" onclick="checkPin()">
        Otwórz ❤️
    </button>

    <div id="message"></div>

</div>


<!-- LOVE -->
<div id="lovePage" class="box hidden">

    <h1>Myszko 🥹❤️</h1>

    <div class="question">
        Kochasz mnie?
    </div>

    <button class="pink" onclick="yesLove()">
        TAK ❤️
    </button>

    <button class="white" onclick="noLove()">
        NIE
    </button>

</div>


<!-- YES -->
<div id="yesPage" class="box hidden">

    <div class="love">
        JA CIEBIE TEŻ<br>
        MYSZKOOOO ❤️
    </div>

    <p>🥹❤️🥹❤️🥹</p>

    <button class="pink" onclick="startGame()">
        🎮 Zagraj w grę miłosną
    </button>

</div>


<!-- QUIZ -->
<div id="quizPage" class="box hidden">

    <h1>🎮 Gra miłosna ❤️</h1>

    <p id="questionNumber"></p>

    <div id="question" class="question"></div>

    <div id="answers" class="answers"></div>

    <p id="score">Punkty: 0</p>

</div>


<script>

const PIN = "20121012";

let questionIndex = 0;
let points = 0;

const questions = [

    {
        text: "Jak nazywam Tereskę? 🐭",
        answers: [
            "Myszką ❤️",
            "Kaczką 🦆",
            "Żabką 🐸",
            "Pingwinem 🐧"
        ],
        correct: 0
    },

    {
        text: "W co lubimy grać? 🎮",
        answers: [
            "Roblox 🎮",
            "Minecraft ⛏️",
            "FIFA ⚽",
            "Fortnite 🎯"
        ],
        correct: 0
    },

    {
        text: "Co najbardziej lubię dostawać od Tereski? 📸",
        answers: [
            "Zdjęcia ❤️",
            "Kartofle 🥔",
            "Zeszyty 📚",
            "Kamienie 🪨"
        ],
        correct: 0
    },

    {
        text: "Jak bardzo ją kocham? ❤️",
        answers: [
            "Bardzo ❤️",
            "Trochę 😐",
            "Nie wiem 🤔",
            "Wcale 😭"
        ],
        correct: 0
    }

];


function hideAll() {
    document.getElementById("pinPage").classList.add("hidden");
    document.getElementById("lovePage").classList.add("hidden");
    document.getElementById("yesPage").classList.add("hidden");
    document.getElementById("quizPage").classList.add("hidden");
}


function checkPin() {

    const enteredPin =
        document.getElementById("pin").value;

    if (enteredPin === PIN) {

        hideAll();

        document.getElementById("lovePage")
            .classList.remove("hidden");

        createHearts(15);

    } else {

        document.getElementById("message").textContent =
            "Zły PIN 😭";

    }
}


function yesLove() {

    hideAll();

    document.getElementById("yesPage")
        .classList.remove("hidden");

    createHearts(40);
    createConfetti(80);

}


function noLove() {

    document.getElementById("message").textContent =
        "Ej no 😭❤️";

}


function startGame() {

    questionIndex = 0;
    points = 0;

    hideAll();

    document.getElementById("quizPage")
        .classList.remove("hidden");

    showQuestion();

}


function showQuestion() {

    const q = questions[questionIndex];

    document.getElementById("questionNumber").textContent =
        "Pytanie " +
        (questionIndex + 1) +
        " / " +
        questions.length;

    document.getElementById("question").textContent =
        q.text;

    document.getElementById("score").textContent =
        "Punkty: " + points;

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    for (let i = 0; i < q.answers.length; i++) {

        const button =
            document.createElement("button");

        button.textContent =
            q.answers[i];

        button.onclick = function() {
            answer(i, button);
        };

        answers.appendChild(button);
    }
}


function answer(selected, button) {

    const q = questions[questionIndex];

    const buttons =
        document.querySelectorAll("#answers button");

    for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
    }


    if (selected === q.correct) {

        points++;

        button.classList.add("correct");

        createHearts(12);

    } else {

        points--;

        button.classList.add("wrong");

        buttons[q.correct].classList.add("correct");

    }


    document.getElementById("score").textContent =
        "Punkty: " + points;


    setTimeout(function() {

        questionIndex++;

        if (questionIndex < questions.length) {

            showQuestion();

        } else {

            endGame();

        }

    }, 1000);

}


function endGame() {

    document.getElementById("questionNumber").textContent =
        "Koniec! ❤️";

    document.getElementById("question").textContent =
        "Twój wynik: " + points + " punktów";

    document.getElementById("answers").innerHTML = "";

    document.getElementById("score").textContent =
        "Myszka ❤️";

    createHearts(50);
    createConfetti(100);

}


function createHearts(amount) {

    for (let i = 0; i < amount; i++) {

        setTimeout(function() {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            heart.textContent =
                ["❤️", "💕", "💗", "💖", "💞"][
                    Math.floor(Math.random() * 5)
                ];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(function() {
                heart.remove();
            }, 6000);

        }, i * 50);

    }

}


function createConfetti(amount) {

    for (let i = 0; i < amount; i++) {

        setTimeout(function() {

            const piece =
                document.createElement("div");

            piece.className = "confetti";

            piece.style.left =
                Math.random() * 100 + "vw";

            piece.style.background =
                "hsl(" +
                Math.random() * 360 +
                ", 80%, 60%)";

            piece.style.animationDuration =
                (2 + Math.random() * 2) + "s";

            document.body.appendChild(piece);

            setTimeout(function() {
                piece.remove();
            }, 5000);

        }, i * 20);

    }

}


document.getElementById("pin").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            checkPin();
        }

    }
);

</script>

</body>
</html>
